<section class="min-w-0 flex-1" aria-label="Products">
    <!-- Header -->
    <div class="mb-5 flex items-end justify-between gap-3">
        <div>
            <h1 class="text-2xl font-semibold text-heading">Products</h1>
            <p class="mt-0.5 text-sm text-body">{{products().products.length}}
                items</p>
        </div>
    </div>

    <!-- Grid -->
    <ul
        class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">

        @for(product of products().products ; track product.id){
        <li>
            <article
                class="group flex h-full flex-col overflow-hidden rounded-2xl border border-default bg-neutral-primary-soft shadow-sm transition hover:shadow-md">
                <div
                    class="relative aspect-square overflow-hidden bg-neutral-secondary-medium">
                    <img [src]="product.images"
                        alt="Wireless Headphones" loading="lazy"
                        class="h-full w-full object-cover transition duration-300 group-hover:scale-105" />
                    <span
                        class="absolute start-3 top-3 rounded-xl bg-neutral-primary-soft/90 px-2.5 py-1 text-xs font-medium text-brand shadow-xs backdrop-blur">{{product.category}}</span>
                    <button type="button"
                        aria-label="Add Wireless Headphones to wishlist"
                        class="absolute end-3 top-3 inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-xl bg-neutral-primary-soft/90 text-body shadow-xs backdrop-blur transition hover:text-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                            aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg"><path
                                d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 10c0 5.65-7 10-7 10Z"
                                stroke="currentColor" stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round" /></svg>
                    </button>
                </div>
                <div class="flex flex-1 flex-col p-5">
                    <h3
                        class="line-clamp-1 text-base font-semibold text-heading">{{product.title}}</h3>
                    <p
                        class="mt-1 line-clamp-2 text-sm text-body">{{product.description}}</p>
                    <div class="mt-3 flex items-center gap-1.5">
                        <div class="flex items-center" aria-hidden="true">
                            <svg class="h-4 w-4 text-brand" fill="currentColor"
                                viewBox="0 0 24 24"><path
                                    d="M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.56L12 17.52l-5.88 3.1 1.12-6.56L2.48 9.42l6.58-.96L12 2.5Z" /></svg>
                            <svg class="h-4 w-4 text-brand" fill="currentColor"
                                viewBox="0 0 24 24"><path
                                    d="M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.56L12 17.52l-5.88 3.1 1.12-6.56L2.48 9.42l6.58-.96L12 2.5Z" /></svg>
                            <svg class="h-4 w-4 text-brand" fill="currentColor"
                                viewBox="0 0 24 24"><path
                                    d="M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.56L12 17.52l-5.88 3.1 1.12-6.56L2.48 9.42l6.58-.96L12 2.5Z" /></svg>
                            <svg class="h-4 w-4 text-brand" fill="currentColor"
                                viewBox="0 0 24 24"><path
                                    d="M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.56L12 17.52l-5.88 3.1 1.12-6.56L2.48 9.42l6.58-.96L12 2.5Z" /></svg>
                            <svg class="h-4 w-4 text-brand" fill="currentColor"
                                viewBox="0 0 24 24"><path
                                    d="M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.56L12 17.52l-5.88 3.1 1.12-6.56L2.48 9.42l6.58-.96L12 2.5Z" /></svg>
                        </div>
                        <span
                            class="text-xs text-body">{{product.rating}}
                            ({{product.reviews.length}})</span>
                    </div>
                    <div
                        class="mt-auto flex items-center justify-between gap-3 pt-5">
                        <span
                            class="text-lg font-semibold text-heading">${{product.price}}</span>
                        <button type="button"
                            class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-brand px-3.5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-strong focus:outline-none focus:ring-2 focus:ring-brand/30">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                                aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg"><path
                                    d="M12 5v14M5 12h14" stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round" /></svg>
                            Add
                        </button>
                    </div>
                </div>
            </article>
        </li>
        }
    </ul>
</section>
