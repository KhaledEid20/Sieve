<nav
    class="bg-neutral-primary sticky w-full z-20 top-0 start-0 border-b border-default">
    <div
        class="max-w-screen-xl mx-auto flex items-center justify-between gap-3 p-4">

        <!-- Logo -->
        <a href
            class="flex items-center space-x-3 rtl:space-x-reverse shrink-0">
            <img src="assets/Logo.png" class="h-7"
                alt="Flowbite Logo" />
            <span
                class="hidden sm:block self-center text-xl text-heading font-semibold whitespace-nowrap uppercase">
                Sieve
            </span>
        </a>

        <!-- Search bar -->
        <form [formGroup]="searchForm">
            <div class="relative flex-1 max-w-md">
                <label for="navbar-search" class="sr-only">Search</label>
                <div
                    class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                    <svg class="w-4 h-4 text-body" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" width="24"
                        height="24"
                        fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round"
                            stroke-width="2"
                            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                    </svg>
                </div>
                <input type="text" id="navbar-search"
                    formControlName="search"
                    class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-main-color focus:border-main-color shadow-xs placeholder:text-body"
                    placeholder="Search">
            </div>
        </form>

    </div>
</nav>
