<button data-drawer-target="logo-sidebar" data-drawer-toggle="logo-sidebar"
    aria-controls="logo-sidebar" type="button"
    class="fixed start-3 top-20 z-50 text-heading cursor-pointer bg-transparent box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-base text-sm p-2 focus:outline-none inline-flex sm:hidden">
    <span class="sr-only">Open sidebar</span>
    <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
        width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
            d="M5 7h14M5 12h14M5 17h10" />
    </svg>
</button>

<aside id="logo-sidebar"
    class="fixed start-0 top-20 z-40 h-[calc(100vh-5rem)] w-64 shrink-0 -translate-x-full transition-transform sm:sticky sm:top-20 sm:z-40 sm:translate-x-0"
    aria-label="Sidebar">
    <div
        class="h-full overflow-y-auto rounded-2xl border border-default bg-neutral-primary-soft px-5 py-6 shadow-sm">
        <div class="flex items-center gap-3 border-b border-default pb-5">
            <span
                class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand/10 text-brand"
                aria-hidden="true">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" />
                </svg>
            </span>
            <div>
                <h2 class="text-base font-semibold text-heading">Filters</h2>
                <p class="mt-0.5 text-xs text-body">Refine your results</p>
            </div>
        </div>

        <form [formGroup]="filterForm">
            <!-- Category dropdown -->
            <div class="mt-6">
                <label for="category"
                    class="mb-2.5 block text-sm font-semibold text-heading">Category</label>
                <select id="category"
                    formControlName="category"
                    class="block w-full rounded-xl border border-default-medium bg-neutral-secondary-medium px-3.5 py-3 text-sm text-heading shadow-xs transition focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
                    <option value selected>All categories</option>
                    @for(category of categories() ;track category.name){
                    <option [value]="category.name">{{category.name}}</option>
                    }
                </select>
            </div>

            <div class="mt-7">
                <span class="mb-3 block text-sm font-semibold text-heading">Sort
                    by</span>
                <ul class="space-y-1.5">
                    <li
                        class="flex items-center rounded-xl px-3 py-2.5 transition hover:bg-neutral-secondary-medium">
                        <input id="sort-price-asc" type="radio"
                            formControlName="sort" name="sort"
                            [value]="{ sortBy: 'price', order: 'asc' }"
                            class="h-4 w-4 border-default-medium bg-neutral-secondary-medium text-brand focus:ring-2 focus:ring-brand">
                        <label for="sort-price-asc"
                            class="ms-3 cursor-pointer text-sm text-heading">Price:
                            Low to High</label>
                    </li>
                    <li
                        class="flex items-center rounded-xl px-3 py-2.5 transition hover:bg-neutral-secondary-medium">
                        <input id="sort-price-desc" formControlName="sort"
                            type="radio" name="sort"
                            [value]="{ sortBy: 'title', order: 'desc' }"
                            class="h-4 w-4 border-default-medium bg-neutral-secondary-medium text-brand focus:ring-2 focus:ring-brand">
                        <label for="sort-price-desc"
                            class="ms-3 cursor-pointer text-sm text-heading">Price:
                            High to Low</label>
                    </li>
                    <li
                        class="flex items-center rounded-xl px-3 py-2.5 transition hover:bg-neutral-secondary-medium">
                        <input id="sort-name-asc" formControlName="sort"
                            type="radio" name="sort"
                            [value]="{ sortBy: 'title', order: 'asc' }"
                            class="h-4 w-4 border-default-medium bg-neutral-secondary-medium text-brand focus:ring-2 focus:ring-brand">
                        <label for="sort-name-asc"
                            class="ms-3 cursor-pointer text-sm text-heading">Name:
                            A to Z</label>
                    </li>
                    <li
                        class="flex items-center rounded-xl px-3 py-2.5 transition hover:bg-neutral-secondary-medium">
                        <input id="sort-name-desc" formControlName="sort"
                            type="radio" name="sort"
                            [value]="{ sortBy: 'title', order: 'desc' }"
                            class="h-4 w-4 border-default-medium bg-neutral-secondary-medium text-brand focus:ring-2 focus:ring-brand">
                        <label for="sort-name-desc"
                            class="ms-3 cursor-pointer text-sm text-heading">Name:
                            Z to A</label>
                    </li>
                </ul>
            </div>

            <button type="reset"
                class="mt-8 flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl border border-default-medium bg-transparent px-4 py-3 text-sm font-semibold text-heading transition hover:bg-neutral-secondary-medium focus:outline-none focus:ring-2 focus:ring-brand/30">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                        d="M4 4v5h5M20 20v-5h-5M5.6 15A8 8 0 0 0 20 12M18.4 9A8 8 0 0 0 4 12"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Reset filters
            </button>
        </form>

    </div>
</aside>
